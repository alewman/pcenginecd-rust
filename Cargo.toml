[package]
name = "pcenginecd-rust"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "A Rust PC Engine CD-ROM2 / Super CD-ROM2 / Arcade Card add-on to pcengine-rust, transcribed from, and proven equivalent to, pcenginecd-python"
license = "MIT"
repository = "https://github.com/alewman/pcenginecd-rust"
readme = "README.md"
publish = false

[lib]
name = "pcenginecd_rust"

[dependencies]
# The base board, pcengine-rust at 8f672f0 by git revision: the clean rewrite of 2026-11-19 and
# the crop of a display that starts before the row (37f17ba, transcribed from pcengine-python
# 03ac699, the revision pcenginecd-python 5c06d1b pins), plus its own git pin of the CPU core,
# huc6280-rust e1d24a3 (2026-11-20; 37f17ba took the core by path, which a git dependency cannot
# use). Nothing is copied from either. (0.2.0 pinned 064c009 by its GitHub revision.) To build
# against a local checkout of the base board instead, without editing this file:
#   cargo build --config 'patch."https://github.com/alewman/pcengine-rust".pcengine-rust.path="../pcengine-rust"'
pcengine_rust = { package = "pcengine-rust", git = "https://github.com/alewman/pcengine-rust", rev = "655c479da5241b409b1b6237a6ff89b91570cee5" }  # 655c479: its history reset (2026-11-21), 8f672f0's board
# Save states (the base board's DeviceState) and the disc's identity in them.
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha1 = "0.10"

[profile.release]
debug = 1
